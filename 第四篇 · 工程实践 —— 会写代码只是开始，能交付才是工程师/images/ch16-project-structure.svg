<?xml version="1.0" encoding="UTF-8"?>
<svg width="580" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="580" height="400" fill="#FAFAFA" rx="8"/>
  <text x="290" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">项目结构：Maven vs Python</text>
  <line x1="290" y1="48" x2="290" y2="370" stroke="#CCC" stroke-dasharray="5,3"/>
  <text x="145" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="bold" fill="#E76F00">Maven 项目</text>
  <text x="435" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="bold" fill="#3776AB">Python 项目</text>

  <rect x="30" y="80" width="230" height="280" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="6"/>
  <text x="50" y="105" font-family="monospace" font-size="11" fill="#333">myproject/</text>
  <text x="65" y="123" font-family="monospace" font-size="11" fill="#333">├ pom.xml</text>
  <text x="65" y="141" font-family="monospace" font-size="11" fill="#333">├ src/</text>
  <text x="80" y="159" font-family="monospace" font-size="11" fill="#333">├ main/</text>
  <text x="95" y="177" font-family="monospace" font-size="11" fill="#333">├ java/</text>
  <text x="110" y="195" font-family="monospace" font-size="11" fill="#333">├ com/</text>
  <text x="125" y="213" font-family="monospace" font-size="11" fill="#333">└ app/</text>
  <text x="140" y="231" font-family="monospace" font-size="11" fill="#333">├ Main.java</text>
  <text x="140" y="249" font-family="monospace" font-size="11" fill="#333">└ User.java</text>
  <text x="80" y="267" font-family="monospace" font-size="11" fill="#333">└ resources/</text>
  <text x="95" y="285" font-family="monospace" font-size="11" fill="#333">└ application.yml</text>
  <text x="65" y="303" font-family="monospace" font-size="11" fill="#333">└ test/</text>
  <text x="80" y="321" font-family="monospace" font-size="11" fill="#333">└ java/</text>
  <text x="95" y="339" font-family="monospace" font-size="11" fill="#333">└ UserTest.java</text>

  <rect x="320" y="80" width="230" height="280" fill="#E3F2FD" stroke="#3776AB" stroke-width="1.5" rx="6"/>
  <text x="340" y="105" font-family="monospace" font-size="11" fill="#333">myproject/</text>
  <text x="355" y="123" font-family="monospace" font-size="11" fill="#333">├ pyproject.toml</text>
  <text x="355" y="141" font-family="monospace" font-size="11" fill="#333">├ src/</text>
  <text x="370" y="159" font-family="monospace" font-size="11" fill="#333">└ myapp/</text>
  <text x="385" y="177" font-family="monospace" font-size="11" fill="#333">├ __init__.py</text>
  <text x="385" y="195" font-family="monospace" font-size="11" fill="#333">├ main.py</text>
  <text x="385" y="213" font-family="monospace" font-size="11" fill="#333">└ models.py</text>
  <text x="385" y="231" font-family="monospace" font-size="11" fill="#333">└ utils/</text>
  <text x="400" y="249" font-family="monospace" font-size="11" fill="#333">└ __init__.py</text>
  <text x="400" y="267" font-family="monospace" font-size="11" fill="#333">└ helpers.py</text>
  <text x="355" y="285" font-family="monospace" font-size="11" fill="#333">├ tests/</text>
  <text x="370" y="303" font-family="monospace" font-size="11" fill="#333">├ test_main.py</text>
  <text x="370" y="321" font-family="monospace" font-size="11" fill="#333">└ test_models.py</text>
  <text x="355" y="339" font-family="monospace" font-size="11" fill="#333">└ .venv/</text>
</svg>
