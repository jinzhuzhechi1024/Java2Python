<?xml version="1.0" encoding="UTF-8"?>
<svg width="580" height="380" xmlns="http://www.w3.org/2000/svg">
  <rect width="580" height="380" fill="#FAFAFA" rx="8"/>
  <text x="290" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">Docker镜像：重卡 vs 自行车</text>
  <line x1="290" y1="48" x2="290" y2="340" stroke="#CCC" stroke-dasharray="5,3"/>

  <rect x="30" y="60" width="240" height="260" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="8"/>
  <text x="150" y="85" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#E76F00">Spring Boot 镜像</text>
  <rect x="55" y="100" width="190" height="100" fill="#FFE0B2" stroke="#E76F00" rx="4"/>
  <text x="150" y="120" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">FROM openjdk:17-slim</text>
  <text x="150" y="135" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">COPY app.jar /app.jar</text>
  <text x="150" y="155" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">ENTRYPOINT java -jar</text>
  <text x="150" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#E76F00">📦</text>
  <text x="150" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#D32F2F">300-500 MB</text>
  <text x="150" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">构建: 60-120s</text>
  <text x="150" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">冷启动: 3-10s</text>
  <text x="150" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">内存: 250-400MB</text>
  <text x="150" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">像重型卡车</text>

  <rect x="310" y="60" width="240" height="260" fill="#E3F2FD" stroke="#3776AB" stroke-width="1.5" rx="8"/>
  <text x="430" y="85" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#3776AB">Python slim 镜像</text>
  <rect x="335" y="100" width="190" height="100" fill="#BBDEFB" stroke="#3776AB" rx="4"/>
  <text x="430" y="120" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">FROM python:3.12-slim</text>
  <text x="430" y="135" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">COPY . /app</text>
  <text x="430" y="155" text-anchor="middle" font-family="monospace" font-size="9" fill="#333">RUN pip install -r req.txt</text>
  <text x="430" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="24" fill="#3776AB">🚲</text>
  <text x="430" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#4CAF50">50-100 MB</text>
  <text x="430" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">构建: 15-30s</text>
  <text x="430" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">冷启动: 0.1-0.5s</text>
  <text x="430" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">内存: 30-50MB</text>
  <text x="430" y="310" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">像轻便自行车</text>
</svg>