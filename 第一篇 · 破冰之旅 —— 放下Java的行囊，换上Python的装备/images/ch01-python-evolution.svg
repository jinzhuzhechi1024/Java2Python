<?xml version="1.0" encoding="UTF-8"?>
<svg width="580" height="380" xmlns="http://www.w3.org/2000/svg">
  <rect width="580" height="380" fill="#FAFAFA" rx="8"/>
  <text x="290" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">Python 生态演进路线</text>

  <line x1="50" y1="180" x2="530" y2="180" stroke="#3776AB" stroke-width="3"/>

  <circle cx="80" cy="180" r="12" fill="#3776AB"/>
  <text x="80" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="bold" fill="#3776AB">1991</text>
  <text x="80" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#555">脚本语言</text>
  <text x="80" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#999">Guido hobby</text>

  <circle cx="170" cy="180" r="12" fill="#3776AB"/>
  <text x="170" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="bold" fill="#3776AB">2000</text>
  <text x="170" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#555">Web开发</text>
  <text x="170" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#999">Django/Flask</text>

  <circle cx="260" cy="180" r="12" fill="#FF9800"/>
  <text x="260" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="bold" fill="#FF9800">2008</text>
  <text x="260" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#555">Py3重构</text>
  <text x="260" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#999">不向后兼容</text>

  <circle cx="350" cy="180" r="14" fill="#4CAF50"/>
  <text x="350" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="bold" fill="#4CAF50">2014</text>
  <text x="350" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#555">数据科学</text>
  <text x="350" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#999">Pandas/NumPy</text>
  <text x="350" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#4CAF50">拐点!</text>

  <circle cx="440" cy="180" r="16" fill="#9C27B0"/>
  <text x="440" y="145" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="bold" fill="#9C27B0">2018</text>
  <text x="440" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#555">AI浪潮</text>
  <text x="440" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#999">PyTorch/TF</text>
  <text x="440" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#9C27B0">爆发!</text>

  <circle cx="520" cy="180" r="18" fill="#D32F2F"/>
  <text x="520" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="bold" fill="#D32F2F">2024+</text>
  <text x="520" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#555">LLM时代</text>
  <text x="520" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#999">langchain</text>
  <text x="520" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#D32F2F" font-weight="bold">垄断!</text>

  <rect x="30" y="280" width="520" height="70" fill="#F5F5F5" stroke="#999" stroke-width="1.5" rx="6"/>
  <text x="290" y="305" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">从圣诞夜hobby项目 → 脚本语言 → Web → 数据科学 → AI → LLM垄断</text>
  <text x="290" y="325" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#9C27B0" font-weight="bold">2014数据科学 + 2016 AI框架诞生 = Python命运的两大拐点</text>
  <text x="290" y="343" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#D32F2F">2024 LLM时代：Python = AI时代的基础设施语言（TIOBE排名第一）</text>
</svg>