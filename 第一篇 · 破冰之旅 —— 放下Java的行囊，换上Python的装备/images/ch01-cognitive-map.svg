<?xml version="1.0" encoding="UTF-8"?>
<svg width="580" height="420" xmlns="http://www.w3.org/2000/svg">
  <rect width="580" height="420" fill="#FAFAFA" rx="8"/>

  <!-- 标题 -->
  <text x="290" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">Java → Python 认知映射地图</text>

  <!-- 分割线 -->
  <line x1="290" y1="48" x2="290" y2="380" stroke="#CCC" stroke-dasharray="5,3"/>

  <!-- 左侧 Java 标题 -->
  <text x="130" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="bold" fill="#E76F00">Java 世界</text>

  <!-- 右侧 Python 标题 -->
  <text x="450" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="bold" fill="#3776AB">Python 世界</text>

  <!-- 映射1: class → class（但更轻量） -->
  <rect x="30" y="80" width="200" height="36" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="6"/>
  <text x="130" y="103" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">class（单继承+接口）</text>

  <rect x="350" y="80" width="200" height="36" fill="#E3F2FD" stroke="#3776AB" stroke-width="1.5" rx="6"/>
  <text x="450" y="103" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">class（多重继承+鸭子类型）</text>

  <line x1="230" y1="98" x2="350" y2="98" stroke="#666" stroke-width="1.5"/>
  <text x="290" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#666">映射1</text>

  <!-- 映射2: interface → Protocol/ABC -->
  <rect x="30" y="126" width="200" height="36" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="6"/>
  <text x="130" y="149" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">interface（implements显式）</text>

  <rect x="350" y="126" width="200" height="36" fill="#E3F2FD" stroke="#3776AB" stroke-width="1.5" rx="6"/>
  <text x="450" y="149" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">Protocol/ABC（隐式满足）</text>

  <line x1="230" y1="144" x2="350" y2="144" stroke="#666" stroke-width="1.5"/>
  <text x="290" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#666">映射2 ⚠️</text>

  <!-- 映射3: try-catch → try-except -->
  <rect x="30" y="172" width="200" height="36" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="6"/>
  <text x="130" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">try-catch（checked+unchecked）</text>

  <rect x="350" y="172" width="200" height="36" fill="#E3F2FD" stroke="#3776AB" stroke-width="1.5" rx="6"/>
  <text x="450" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">try-except（全unchecked）</text>

  <line x1="230" y1="190" x2="350" y2="190" stroke="#666" stroke-width="1.5"/>
  <text x="290" y="186" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#666">映射3</text>

  <!-- 映射4: Thread → threading/asyncio -->
  <rect x="30" y="218" width="200" height="36" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="6"/>
  <text x="130" y="241" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">Thread（OS线程，1MB栈）</text>

  <rect x="350" y="218" width="200" height="36" fill="#E3F2FD" stroke="#3776AB" stroke-width="1.5" rx="6"/>
  <text x="450" y="241" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">asyncio协程（单线程高并发）</text>

  <line x1="230" y1="236" x2="350" y2="236" stroke="#666" stroke-width="1.5"/>
  <text x="290" y="232" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#666">映射4 ⚠️</text>

  <!-- 映射5: 注解 → 装饰器 -->
  <rect x="30" y="264" width="200" height="36" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="6"/>
  <text x="130" y="287" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">注解（@Autowired 标注身份）</text>

  <rect x="350" y="264" width="200" height="36" fill="#E3F2FD" stroke="#3776AB" stroke-width="1.5" rx="6"/>
  <text x="450" y="287" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">装饰器（@cache 包装行为）</text>

  <line x1="230" y1="282" x2="350" y2="282" stroke="#666" stroke-width="1.5"/>
  <text x="290" y="278" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#666">映射5 ⚠️</text>

  <!-- 底部说明 -->
  <rect x="30" y="320" width="520" height="50" fill="#FFEBEE" stroke="#D32F2F" stroke-width="1.5" rx="6"/>
  <text x="290" y="340" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#D32F2F" font-weight="bold">⚠️ 标记的三组映射是"形似神不似"的高危陷阱区</text>
  <text x="290" y="358" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#D32F2F">接口 / 并发 / 装饰器——后续每篇深入展开</text>
</svg>
