<?xml version="1.0" encoding="UTF-8"?>
<svg width="580" height="380" xmlns="http://www.w3.org/2000/svg">
  <rect width="580" height="380" fill="#FAFAFA" rx="8"/>
  <text x="290" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">multiprocessing：修平行车道绕过GIL</text>

  <rect x="30" y="55" width="240" height="280" fill="#FFEBEE" stroke="#D32F2F" stroke-width="1.5" rx="8"/>
  <text x="150" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#D32F2F">threading（单车道）</text>
  <rect x="120" y="100" width="60" height="30" fill="#D32F2F" rx="4"/>
  <text x="150" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#fff">GIL</text>
  <rect x="60" y="110" width="50" height="15" fill="#FF9800" rx="2"/>
  <text x="85" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#fff">T1</text>
  <rect x="190" y="110" width="50" height="15" fill="#9C27B0" rx="2"/>
  <text x="215" y="122" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#fff">T2</text>
  <text x="150" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#D32F2F">共享1个GIL→无法并行</text>
  <text x="150" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">内存：8MB/线程</text>
  <text x="150" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">数据共享：直接访问</text>
  <text x="150" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">创建成本：1ms</text>
  <text x="150" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#D32F2F" font-weight="bold">CPU密集：0.7x（更慢!）</text>
  <text x="150" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#4CAF50">IO少量：3x加速</text>

  <rect x="310" y="55" width="240" height="280" fill="#E8F5E9" stroke="#4CAF50" stroke-width="1.5" rx="8"/>
  <text x="430" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#4CAF50">multiprocessing（平行车道）</text>
  <rect x="340" y="100" width="45" height="30" fill="#4CAF50" rx="4"/>
  <text x="362" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#fff">P1+GIL</text>
  <rect x="395" y="100" width="45" height="30" fill="#4CAF50" rx="4"/>
  <text x="417" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#fff">P2+GIL</text>
  <rect x="450" y="100" width="45" height="30" fill="#4CAF50" rx="4"/>
  <text x="472" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#fff">P3+GIL</text>
  <rect x="505" y="100" width="35" height="30" fill="#4CAF50" rx="4"/>
  <text x="522" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#fff">P4</text>
  <text x="430" y="150" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#4CAF50">各进程独立GIL→真正并行</text>
  <text x="430" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">内存：30MB+/进程</text>
  <text x="430" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">数据共享：需pickle序列化</text>
  <text x="430" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">创建成本：30ms</text>
  <text x="430" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#4CAF50" font-weight="bold">CPU密集：3.7x加速 ✅</text>
  <text x="430" y="270" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">代价：内存大30x</text>
</svg>