<?xml version="1.0" encoding="UTF-8"?>
<svg width="580" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="580" height="400" fill="#FAFAFA" rx="8"/>
  <text x="290" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">函数地位：部门员工 vs 自由职业者</text>
  <line x1="290" y1="48" x2="290" y2="350" stroke="#CCC" stroke-dasharray="5,3"/>
  <text x="130" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="bold" fill="#E76F00">Java 方法</text>
  <text x="450" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="bold" fill="#3776AB">Python 函数</text>

  <rect x="30" y="80" width="200" height="36" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="6"/>
  <text x="130" y="103" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">必须依附于类</text>
  <rect x="350" y="80" width="200" height="36" fill="#E3F2FD" stroke="#3776AB" stroke-width="1.5" rx="6"/>
  <text x="450" y="103" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">可独立存在于模块</text>
  <line x1="230" y1="98" x2="350" y2="98" stroke="#666" stroke-width="1.5"/>

  <rect x="30" y="126" width="200" height="36" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="6"/>
  <text x="130" y="149" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">不能赋值给变量</text>
  <rect x="350" y="126" width="200" height="36" fill="#E3F2FD" stroke="#3776AB" stroke-width="1.5" rx="6"/>
  <text x="450" y="149" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">f = greet; f() ✅</text>
  <line x1="230" y1="144" x2="350" y2="144" stroke="#666" stroke-width="1.5"/>

  <rect x="30" y="172" width="200" height="36" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="6"/>
  <text x="130" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">不能当参数传递</text>
  <rect x="350" y="172" width="200" height="36" fill="#E3F2FD" stroke="#3776AB" stroke-width="1.5" rx="6"/>
  <text x="450" y="195" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">apply(greet, x) ✅</text>
  <line x1="230" y1="190" x2="350" y2="190" stroke="#666" stroke-width="1.5"/>

  <rect x="30" y="218" width="200" height="36" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="6"/>
  <text x="130" y="241" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">不能存入集合</text>
  <rect x="350" y="218" width="200" height="36" fill="#E3F2FD" stroke="#3776AB" stroke-width="1.5" rx="6"/>
  <text x="450" y="241" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">{&#39;greet&#39;: greet} ✅</text>
  <line x1="230" y1="236" x2="350" y2="236" stroke="#666" stroke-width="1.5"/>

  <rect x="30" y="264" width="200" height="36" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="6"/>
  <text x="130" y="287" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">不能当返回值</text>
  <rect x="350" y="264" width="200" height="36" fill="#E3F2FD" stroke="#3776AB" stroke-width="1.5" rx="6"/>
  <text x="450" y="287" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#333">return make_fn() ✅</text>
  <line x1="230" y1="282" x2="350" y2="282" stroke="#666" stroke-width="1.5"/>

  <rect x="30" y="320" width="520" height="50" fill="#F5F5F5" stroke="#999" stroke-width="1.5" rx="6"/>
  <text x="290" y="340" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">Java方法 = 部门员工：必须挂在某个类下面，不能独立行动</text>
  <text x="290" y="358" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">Python函数 = 自由职业者：可赋值、传参、返回、存字典，来去自由</text>
</svg>