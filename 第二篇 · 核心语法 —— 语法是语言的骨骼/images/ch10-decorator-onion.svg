<?xml version="1.0" encoding="UTF-8"?>
<svg width="580" height="400" xmlns="http://www.w3.org/2000/svg">
  <rect width="580" height="400" fill="#FAFAFA" rx="8"/>
  <text x="290" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">多层装饰器：洋葱模型</text>

  <ellipse cx="290" cy="210" rx="250" ry="150" fill="#FFF3E0" stroke="#E76F00" stroke-width="2"/>
  <text x="290" y="80" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#E76F00">@decorator_a (最外层)</text>

  <ellipse cx="290" cy="210" rx="180" ry="110" fill="#E3F2FD" stroke="#3776AB" stroke-width="2"/>
  <text x="290" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#3776AB">@decorator_b (中间层)</text>

  <ellipse cx="290" cy="210" rx="110" ry="70" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2"/>
  <text x="290" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="bold" fill="#4CAF50">@decorator_c (最内层)</text>

  <ellipse cx="290" cy="210" rx="50" ry="35" fill="#F3E5F5" stroke="#9C27B0" stroke-width="2"/>
  <text x="290" y="215" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="bold" fill="#9C27B0">func()</text>

  <text x="60" y="210" font-family="system-ui,sans-serif" font-size="20" fill="#4CAF50">→</text>
  <text x="60" y="230" font-family="system-ui,sans-serif" font-size="10" fill="#666">进入</text>
  <text x="510" y="210" font-family="system-ui,sans-serif" font-size="20" fill="#E76F00">←</text>
  <text x="500" y="230" font-family="system-ui,sans-serif" font-size="10" fill="#666">退出</text>

  <text x="290" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#333">执行顺序：a进入 → b进入 → c进入 → func() → c退出 → b退出 → a退出</text>
  <text x="290" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">像洋葱：从外到内进入，从内到外退出</text>
  <text x="290" y="325" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3776AB" font-weight="bold">@a 拆包装等价于：func = a(b(c(func)))</text>
  <text x="290" y="345" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#E76F00">Java注解 = 胸牌(贴标签，不改变行为)  |  Python装饰器 = 快递包装(直接改变行为)</text>
</svg>