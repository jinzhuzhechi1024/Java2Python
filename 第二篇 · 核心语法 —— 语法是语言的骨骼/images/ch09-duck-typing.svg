<?xml version="1.0" encoding="UTF-8"?>
<svg width="580" height="380" xmlns="http://www.w3.org/2000/svg">
  <rect width="580" height="380" fill="#FAFAFA" rx="8"/>
  <text x="290" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">接口契约：签证(显式) vs 免签(隐式)</text>
  <line x1="290" y1="48" x2="290" y2="340" stroke="#CCC" stroke-dasharray="5,3"/>

  <rect x="30" y="60" width="240" height="260" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="8"/>
  <text x="150" y="85" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#E76F00">Java interface = 签证</text>
  <text x="150" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">1. 申请：implements Comparable</text>
  <text x="150" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">2. 审核：编译期检查所有方法</text>
  <text x="150" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">3. 盖章：通过才能入境使用</text>
  <rect x="50" y="175" width="200" height="30" fill="#FFEBEE" stroke="#D32F2F" rx="4"/>
  <text x="150" y="194" text-anchor="middle" font-family="monospace" font-size="10" fill="#D32F2F">class User implements Comparable</text>
  <text x="150" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#D32F2F">❌ 不implements就不能sort()</text>
  <text x="150" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#D32F2F">❌ 少实现一个方法→编译报错</text>
  <text x="150" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">入境处查护照，严格但安全</text>
  <text x="150" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">编译期拦截，零运行时开销</text>

  <rect x="310" y="60" width="240" height="260" fill="#E3F2FD" stroke="#3776AB" stroke-width="1.5" rx="8"/>
  <text x="430" y="85" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#3776AB">Python 鸭子类型 = 免签</text>
  <text x="430" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">1. 不需要申请（不用implements）</text>
  <text x="430" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">2. 不需要审核（编译期不查）</text>
  <text x="430" y="155" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">3. 直接入境（有方法就行）</text>
  <rect x="330" y="175" width="200" height="30" fill="#E8F5E9" stroke="#4CAF50" rx="4"/>
  <text x="430" y="194" text-anchor="middle" font-family="monospace" font-size="10" fill="#2E7D32">class User:  # 有__lt__就够</text>
  <text x="430" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#4CAF50">✅ 有__lt__就能sort()</text>
  <text x="430" y="250" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#4CAF50">✅ 不需要声明任何接口</text>
  <text x="430" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">入境处不查护照，自由但靠自觉</text>
  <text x="430" y="300" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">Protocol+mypy可加软约束</text>
</svg>