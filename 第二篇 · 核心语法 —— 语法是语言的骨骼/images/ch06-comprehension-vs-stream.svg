<?xml version="1.0" encoding="UTF-8"?>
<svg width="580" height="380" xmlns="http://www.w3.org/2000/svg">
  <rect width="580" height="380" fill="#FAFAFA" rx="8"/>
  <text x="290" y="28" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="bold" fill="#333">列表推导 vs Stream API：数学公式 vs 流水线</text>

  <rect x="30" y="50" width="260" height="290" fill="#FFF3E0" stroke="#E76F00" stroke-width="1.5" rx="8"/>
  <text x="160" y="75" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#E76F00">Java Stream 流水线</text>
  <rect x="50" y="90" width="220" height="28" fill="#FFE0B2" stroke="#E76F00" rx="4"/>
  <text x="160" y="108" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">users.stream()</text>
  <text x="160" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#999">↓</text>
  <rect x="50" y="140" width="220" height="28" fill="#FFE0B2" stroke="#E76F00" rx="4"/>
  <text x="160" y="158" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">.filter(u -&gt; u.age &gt; 18)</text>
  <text x="160" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#999">↓</text>
  <rect x="50" y="190" width="220" height="28" fill="#FFE0B2" stroke="#E76F00" rx="4"/>
  <text x="160" y="208" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">.map(u -&gt; u.name.upper())</text>
  <text x="160" y="230" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#999">↓</text>
  <rect x="50" y="240" width="220" height="28" fill="#FFE0B2" stroke="#E76F00" rx="4"/>
  <text x="160" y="258" text-anchor="middle" font-family="monospace" font-size="10" fill="#333">.collect(toList())</text>
  <text x="160" y="290" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">5行 · 数据依次通过4个工位</text>
  <text x="160" y="308" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">像工厂流水线</text>

  <rect x="310" y="50" width="240" height="290" fill="#E3F2FD" stroke="#3776AB" stroke-width="1.5" rx="8"/>
  <text x="430" y="75" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="bold" fill="#3776AB">Python 列表推导</text>
  <rect x="330" y="100" width="200" height="50" fill="#BBDEFB" stroke="#3776AB" stroke-width="2" rx="6"/>
  <text x="430" y="122" text-anchor="middle" font-family="monospace" font-size="11" fill="#0D47A1">[u.name.upper()</text>
  <text x="430" y="138" text-anchor="middle" font-family="monospace" font-size="11" fill="#0D47A1"> for u in users if u.age&gt;18]</text>
  <text x="430" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" fill="#3776AB">=</text>
  <rect x="330" y="200" width="200" height="50" fill="#E8F5E9" stroke="#4CAF50" stroke-width="2" rx="6"/>
  <text x="430" y="222" text-anchor="middle" font-family="monospace" font-size="13" fill="#2E7D32">{f(x) | x&#8712;S, P(x)}</text>
  <text x="430" y="240" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#555">数学集合定义</text>
  <text x="430" y="280" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">1行 · 一次性表达完整意图</text>
  <text x="430" y="298" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#666">像数学公式</text>
  <text x="430" y="316" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#4CAF50" font-weight="bold">Pythonic!</text>
</svg>